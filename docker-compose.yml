# Local databases for MovieTicketSystem (Owner: Mizt)
#   docker compose up -d
# MySQL loads database/schema.sql then database/seed.sql automatically on
# the FIRST start. To reset: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: mts_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: movie_ticket_system
      MYSQL_USER: movie_app
      MYSQL_PASSWORD: movie_pass
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: mts_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
