{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-box card">
  <h1>Create account</h1>
  <form method="post">
    <div class="field"><label>Full name</label><input name="name" required maxlength="100" value="{{ request.form.name }}"></div>
    <div class="field"><label>Email</label><input name="email" type="email" required value="{{ request.form.email }}"></div>
    <div class="field"><label>Password (min 6 characters)</label><input name="password" type="password" required minlength="6"></div>
    <div class="field"><label>Confirm password</label><input name="confirm" type="password" required minlength="6"></div>
    <button class="btn primary block" type="submit">Register</button>
  </form>
  <p class="small muted" style="margin-top:1rem">Already have an account? <a class="link" href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
